<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Teacher AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }
    .notfound-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      max-width: 32rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 1.25rem 3.125rem rgba(15, 23, 42, 0.08);
      animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .notfound-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -2px;
    }
    .notfound-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .notfound-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.55;
      margin-bottom: 2rem;
    }
    .notfound-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent-gradient);
      color: #fff;
      padding: 0.75rem 1.75rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .notfound-home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body class="dark-theme">
  <main class="notfound-container">
    <div class="notfound-card">
      <div class="auth-logo" style="margin-bottom: 1.25rem;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="notfound-badge">404</div>
      <h1>Page Not Found</h1>
      <p>The lesson or page you're searching for does not exist or may have been moved.</p>
      <a href="/" class="notfound-home-btn touch-target">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 1rem; color: var(--text-muted); display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="/" style="color: var(--text-muted); text-decoration: none;">Home</a>
        <span>•</span>
        <a href="/privacy" style="color: var(--text-muted); text-decoration: none;">Privacy Policy</a>
        <span>•</span>
        <a href="/terms" style="color: var(--text-muted); text-decoration: none;">Terms of Service</a>
        <span>•</span>
        <a href="mailto:teacherai.support@gmail.com" class="contact-email-link" style="color: var(--text-muted); text-decoration: none;">Contact</a>
      </div>
    </div>
  </main>
  <script>
    fetch('/api/config')
      .then(r => r.json())
      .then(d => {
        if (d && d.contactEmail) {
          document.querySelectorAll('.contact-email-link').forEach(a => {
            a.href = 'mailto:' + encodeURIComponent(d.contactEmail) + '?subject=Support%20-%20TEACHER%20AI';
          });
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
